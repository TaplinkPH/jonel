<title>Jonel Mojica</title>

<style>
/* Layout: one centered column on a warm morning sky; a big golden sun rises behind the logo and navy outrigger waves roll along the bottom, taken from the "Philippines 2026" mark. Single light look by choice. */
:root {
  --sky: #fffaf0;
  --sky-warm: #ffe9bf;
  --sun: #ffc355;
  --sun-deep: #f5a623;
  --navy: #183057;
  --navy-soft: #4a5d80;
  --white: #ffffff;
  --wa: #25d366;
  --fb: #1877f2;
  --ig: linear-gradient(45deg, #feda75 0%, #fa7e1e 25%, #d62976 55%, #962fbf 78%, #4f5bd5 100%);
  --tt: #000000;
  --tt-cyan: #25f4ee;
  --tt-pink: #fe2c55;
  --display: "Saira Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: linear-gradient(180deg, var(--sky-warm) 0%, var(--sky) 45%) fixed, var(--sky);
  color: var(--navy);
  font-family: var(--body);
  font-size: 15px; line-height: 1.5;
  padding-inline: 20px;
  overflow-x: hidden;
}
.scene { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.sun {
  position: absolute; left: 50%; top: -120px; width: 560px; height: 560px; margin-left: -280px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,195,85,.55) 0%, rgba(255,195,85,.22) 45%, rgba(255,195,85,0) 70%);
  animation: breathe 8s ease-in-out infinite alternate;
}
@keyframes breathe { to { transform: scale(1.06); } }
.waves { position: absolute; left: 0; right: 0; bottom: 0; height: 90px; }
.waves svg { position: absolute; bottom: 0; width: 200%; height: 100%; animation: roll 18s linear infinite; }
.waves .w2 { opacity: .35; bottom: 14px; animation-duration: 26s; animation-direction: reverse; }
@keyframes roll { to { transform: translateX(-50%); } }

.wrap {
  position: relative; z-index: 1;
  max-width: 440px; margin: 0 auto;
  padding-block: 40px 130px;
  display: flex; flex-direction: column; align-items: center; gap: 26px;
}
.id { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.logo {
  width: 188px; height: 188px; border-radius: 50%;
  padding: 5px; background: var(--white);
  box-shadow: 0 0 0 4px var(--navy), 0 0 0 10px rgba(255,195,85,.55), 0 20px 40px rgba(24,48,87,.22);
  animation: rise-sun .8s cubic-bezier(.34,1.56,.64,1) both;
}
.logo { position: relative; }
.logo img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
.logo .badge {
  position: absolute; right: -6px; bottom: -2px; width: 64px; height: 64px;
  border-radius: 50%; background: var(--white); border: 3px solid var(--navy);
  box-shadow: 0 6px 14px rgba(24,48,87,.25);
}
.hi { margin: 16px 0 0; font-family: var(--display); font-weight: 700; font-size: 14px; letter-spacing: .2em; text-transform: uppercase; color: var(--sun-deep); }
h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 42px; line-height: 1; letter-spacing: -0.01em; text-wrap: balance; color: var(--navy); }

.links { width: 100%; display: flex; flex-direction: column; gap: 14px; list-style: none; margin: 0; padding: 0; }
.links li { animation: rise .5s ease-out both; }
.links li:nth-child(1) { animation-delay: .15s; }
.links li:nth-child(2) { animation-delay: .25s; }
.links li:nth-child(3) { animation-delay: .35s; }
.links li:nth-child(4) { animation-delay: .45s; }
.btn {
  display: flex; align-items: center; gap: 14px; width: 100%;
  padding: 14px 18px 14px 14px; border-radius: 16px;
  color: #fff; text-decoration: none;
  font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: .005em;
  box-shadow: 0 10px 22px rgba(24,48,87,.18);
  transition: transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s ease, filter .18s ease;
}
.btn:hover { transform: translateY(-3px); filter: brightness(1.05); box-shadow: 0 14px 28px rgba(24,48,87,.26); }
.btn:active { transform: scale(.98); }
.btn:focus-visible { outline: 3px solid var(--navy); outline-offset: 3px; }
.wa { background: var(--wa); }
.fb { background: var(--fb); }
.ig { background: var(--ig); }
.tt { background: var(--tt); box-shadow: -3px -2px 0 var(--tt-cyan), 3px 2px 0 var(--tt-pink), 0 10px 22px rgba(24,48,87,.18); }
.icon { width: 42px; height: 42px; flex: none; border-radius: 12px; display: grid; place-items: center; background: rgba(255,255,255,.18); }
.icon svg { width: 24px; height: 24px; }
.label { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.15; }
.sub { font-family: var(--body); font-weight: 500; font-size: 13.5px; opacity: .9; overflow-wrap: anywhere; }
.arrow { flex: none; font-size: 22px; font-weight: 700; opacity: .85; }

footer { font-family: var(--display); font-weight: 700; font-size: 18px; text-align: center; color: var(--navy); }
footer span { display: block; font-family: var(--body); font-weight: 500; font-size: 14px; color: var(--navy-soft); margin-top: 2px; }

@keyframes rise-sun { from { transform: translateY(30px) scale(.8); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .sun, .waves svg, .logo, .links li { animation: none; }
  .btn { transition: none; } .btn:hover { transform: none; }
}
</style>
</head>
